<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>FIFA World Cup 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap');
:root {
  --verde:#00C165; --negro:#0A0A0A; --gris-oscuro:#111;
  --gris-medio:#1A1A1A; --gris-card:#222; --gris-borde:#2E2E2E;
  --texto:#E8E8E8; --texto-dim:#777; --oro:#FFD700; --rojo:#E63946;
  --c-uefa:#5BC8F5; --c-conmebol:#FFD700; --c-concacaf:#FF8C42;
  --c-caf:#9B59B6; --c-afc:#E63946; --c-ofc:#2ECC71;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{overflow-x:hidden;}
body{background:var(--negro);color:var(--texto);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;max-width:100%;}

/* HEADER */
header{background:var(--gris-oscuro);border-bottom:2px solid var(--verde);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:3px;color:var(--verde);}
.logo span{color:var(--texto);}
nav{display:flex;gap:4px;}
nav button{background:none;border:none;color:var(--texto-dim);font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;padding:5px 12px;border-radius:4px;transition:all .2s;letter-spacing:.5px;text-transform:uppercase;}
nav button:hover{color:var(--texto);background:var(--gris-medio);}
nav button.active{color:var(--negro) !important;background:var(--verde) !important;}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--gris-borde);border-bottom:1px solid var(--gris-borde);}
.stat-cell{background:var(--gris-oscuro);padding:.7rem 1rem;text-align:center;}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--verde);line-height:1;}
.stat-lbl{font-size:.62rem;color:var(--texto-dim);letter-spacing:1px;text-transform:uppercase;}

/* PROGRESS BAR */
.progress-wrap{display:flex;gap:3px;padding:.5rem 1.5rem;background:var(--gris-oscuro);border-bottom:1px solid var(--gris-borde);align-items:stretch;overflow-x:auto;}
.phase-seg{flex:1 0 auto;min-width:max-content;text-align:center;padding:4px 10px;border-radius:4px;background:var(--gris-medio);border:1px solid var(--gris-borde);font-size:.58rem;letter-spacing:.5px;text-transform:uppercase;color:var(--texto-dim);position:relative;white-space:nowrap;}
.phase-seg .ph-dates{display:block;font-size:.55rem;opacity:.7;}
.phase-seg.done{border-color:rgba(0,193,101,.3);color:var(--verde);opacity:.6;}
.phase-seg.current{border-color:var(--verde);background:rgba(0,193,101,.12);color:var(--verde);font-weight:700;}
.phase-seg.current::after{content:'● EN CURSO';position:absolute;top:-7px;right:4px;font-size:.5rem;color:var(--verde);background:var(--gris-oscuro);padding:0 3px;border-radius:2px;}

/* TABS */
.tab{display:none;}.tab.active{display:block;}

/* CONF COLORS */
.conf-UEFA{border-left:3px solid var(--c-uefa);}
.conf-CONMEBOL{border-left:3px solid var(--c-conmebol);}
.conf-CONCACAF{border-left:3px solid var(--c-concacaf);}
.conf-CAF{border-left:3px solid var(--c-caf);}
.conf-AFC{border-left:3px solid var(--c-afc);}
.conf-OFC{border-left:3px solid var(--c-ofc);}
.tagc-UEFA{color:var(--c-uefa)!important;}
.tagc-CONMEBOL{color:var(--c-conmebol)!important;}
.tagc-CONCACAF{color:var(--c-concacaf)!important;}
.tagc-CAF{color:var(--c-caf)!important;}
.tagc-AFC{color:var(--c-afc)!important;}
.tagc-OFC{color:var(--c-ofc)!important;}

/* ── GRUPOS ── */
#tab-grupos{padding:1.5rem;max-width:1400px;margin:0 auto;}
.grupos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;}
.grupo-sub{font-size:.6rem;letter-spacing:1px;text-transform:uppercase;color:var(--texto-dim);padding:8px 12px 2px;border-top:1px solid var(--gris-borde);}
.grupo-card{background:var(--gris-card);border:1px solid var(--gris-borde);border-radius:8px;overflow:hidden;}
.grupo-head{background:var(--gris-oscuro);padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gris-borde);}
.grupo-letra{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--verde);line-height:1;}
.grupo-fechas{font-size:.68rem;color:var(--texto-dim);text-align:right;}
.equipo-row{display:flex;align-items:center;gap:.6rem;padding:.5rem 1rem;border-bottom:1px solid #1C1C1C;font-size:.82rem;}
.equipo-row:last-child{border-bottom:none;}
.eq-flag{font-size:1.3rem;}.eq-nombre{flex:1;font-weight:500;}
.eq-tag{font-size:.62rem;padding:2px 6px;border-radius:3px;letter-spacing:.5px;}
.tag-host{color:var(--oro);background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);}
.tag-conf{color:var(--texto-dim);background:#252525;}
.grupo-partidos{padding:.5rem;}
.partido-mini{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.4rem;background:#1C1C1C;border-radius:5px;padding:.45rem .6rem;margin-bottom:.4rem;font-size:.72rem;}
.partido-mini:last-child{margin-bottom:0;}
.pm-team{display:flex;align-items:center;gap:4px;}
.pm-team.right{flex-direction:row-reverse;}
.pm-center{text-align:center;color:var(--texto-dim);font-size:.65rem;}
.pm-score{font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:var(--texto);}
.pm-jornada{font-size:.6rem;color:var(--verde);}
.pm-hora{font-size:.72rem;color:var(--texto);font-weight:600;}

/* ── POSICIONES ── */
#tab-posiciones{padding:1.5rem;max-width:1400px;margin:0 auto;}
.pos-toolbar{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem;flex-wrap:wrap;}
.pos-toolbar h2{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--verde);}
.btn-save{background:var(--verde);color:var(--negro);border:none;font-family:'Inter',sans-serif;font-weight:700;font-size:.75rem;padding:6px 16px;border-radius:4px;cursor:pointer;letter-spacing:.5px;}
.btn-save:hover{background:#00a854;}
.btn-save:disabled{opacity:.5;cursor:wait;}
.btn-reset{background:none;color:var(--texto-dim);border:1px solid var(--gris-borde);font-family:'Inter',sans-serif;font-size:.75rem;padding:6px 14px;border-radius:4px;cursor:pointer;}
.btn-reset:hover{color:var(--rojo);border-color:var(--rojo);}
.api-status{font-size:.72rem;color:var(--texto-dim);}
.api-status.ok{color:var(--verde);}
.api-status.err{color:var(--rojo);}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;}
.pos-card{background:var(--gris-card);border:1px solid var(--gris-borde);border-radius:8px;overflow:hidden;}
.pos-head{background:var(--gris-oscuro);padding:.5rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gris-borde);}
.pos-letra{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--verde);}
.pos-table{width:100%;border-collapse:collapse;font-size:.75rem;}
.pos-table th{padding:5px 6px;text-align:center;color:var(--texto-dim);font-weight:600;font-size:.65rem;letter-spacing:.5px;border-bottom:1px solid var(--gris-borde);background:var(--gris-oscuro);}
.pos-table th.left{text-align:left;padding-left:10px;}
.pos-table td{padding:4px 6px;text-align:center;border-bottom:1px solid #1C1C1C;}
.pos-table td.team-cell{text-align:left;display:flex;align-items:center;gap:5px;padding:4px 10px;white-space:nowrap;}
.pos-table tr:last-child td{border-bottom:none;}
.pos-table tr.clasifica-1{background:rgba(0,193,101,.08);}
.pos-table tr.clasifica-2{background:rgba(0,193,101,.04);}
.pos-table tr.tercero{background:rgba(255,215,0,.04);}
.pts-cell{font-weight:700;color:var(--verde);}
.pos-num{font-weight:700;font-size:.7rem;width:16px;text-align:center;color:var(--texto-dim);}
.pos-num.p1{color:var(--verde);}
.pos-num.p2{color:#5BC8F5;}
.pos-num.p3{color:var(--oro);}
.badge-clasifica{font-size:.55rem;padding:1px 4px;border-radius:2px;letter-spacing:.3px;}
.badge-c1{background:rgba(0,193,101,.2);color:var(--verde);}
.badge-c2{background:rgba(91,200,245,.15);color:#5BC8F5;}
.badge-c3{background:rgba(255,215,0,.15);color:var(--oro);}
.badge-c3.no{opacity:.35;}
.badge-tercero-q{background:rgba(0,193,101,.2);color:var(--verde);}
.badge-no-q{background:rgba(200,200,200,.1);color:var(--texto-dim);font-size:.55rem;padding:1px 4px;border-radius:2px;letter-spacing:.3px;}
.pos-table tr.califica-tercero{background:rgba(0,193,101,.04);}
.pos-table tr.no-califica-tercero{background:rgba(200,200,200,.02);opacity:.6;}
.grupo-cell{color:var(--texto-dim);white-space:nowrap;}
.terceros-card{margin-top:2rem;}
.terceros-card .pos-table{max-width:820px;}
.terceros-card .pos-table th.pos-col{width:34px;}
.terceros-card .pos-table th.left,.terceros-card .pos-table td.team-cell{width:150px;}
.terceros-card .pos-table th.grupo-col,.terceros-card .pos-table td.grupo-cell{width:52px;}
.legend{display:flex;gap:1rem;margin-bottom:1rem;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--texto-dim);}
.leg-dot{width:10px;height:10px;border-radius:2px;}

/* ── PARTIDOS ── */
#tab-partidos{padding:1.5rem;max-width:1400px;margin:0 auto;}
.fase-bloque{margin-bottom:2rem;}
.fase-titulo{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;color:var(--negro);background:var(--verde);padding:3px 10px;border-radius:3px;display:inline-block;margin-bottom:.8rem;}
.partidos-lista{display:flex;flex-direction:column;gap:.4rem;}
.partido-row{background:var(--gris-card);border:1px solid var(--gris-borde);border-radius:6px;padding:.55rem 1rem;display:grid;grid-template-columns:80px 1fr auto 1fr 80px;align-items:center;gap:.5rem;font-size:.78rem;}
.partido-row.live{border-color:var(--rojo);}
.pr-fecha{color:var(--verde);font-size:.68rem;font-weight:600;}
.pr-hora{font-size:.74rem;font-weight:700;color:var(--texto);}
.pr-num{font-size:.6rem;color:var(--texto-dim);}
.pr-team{display:flex;align-items:center;gap:5px;font-weight:500;}
.pr-team.right{flex-direction:row-reverse;}
.pr-vs{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--texto);font-weight:700;text-align:center;display:flex;align-items:center;gap:4px;}
.pr-sede{font-size:.62rem;color:var(--texto-dim);text-align:right;}
.score-input{background:transparent;border:1px solid var(--gris-borde);color:var(--texto);font-family:'Bebas Neue',sans-serif;font-size:1.4rem;font-weight:700;width:38px;height:34px;text-align:center;border-radius:4px;}
.score-input:focus{outline:none;border-color:var(--verde);color:var(--verde);}
.score-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rojo);animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.2;}}

/* ── BRACKET ── */
#tab-bracket{padding:.8rem 0 2rem;}
.bracket-toolbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:0 1.5rem .8rem;}
.instr{display:inline-flex;align-items:center;gap:.4rem;background:rgba(0,193,101,.08);border:1px solid rgba(0,193,101,.2);border-radius:4px;padding:.3rem .8rem;font-size:.72rem;color:var(--texto-dim);}
#sim-banner{flex-basis:100%;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:rgba(255,193,7,.1);border:1px solid rgba(255,193,7,.35);border-radius:4px;padding:.4rem .8rem;font-size:.74rem;color:#FFD27D;}
#sim-banner b{color:#FFE0A3;}
.bracket-scroll{overflow-x:auto;padding:1rem 1.5rem 2rem;cursor:grab;-webkit-overflow-scrolling:touch;}
.bracket-scroll:active{cursor:grabbing;}
.bracket-canvas{display:flex;gap:0;align-items:stretch;min-width:fit-content;width:fit-content;margin:0 auto;position:relative;}
#bracket-lines{position:absolute;top:0;left:0;z-index:0;pointer-events:none;}
.phase-col{display:flex;flex-direction:column;flex-shrink:0;position:relative;z-index:1;}
.phase-label{font-family:'Bebas Neue',sans-serif;font-size:.82rem;letter-spacing:2px;color:var(--verde);text-align:center;padding:.4rem .3rem;background:var(--gris-oscuro);border:1px solid var(--gris-borde);border-radius:4px 4px 0 0;margin-bottom:.3rem;white-space:nowrap;}
.phase-matches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:4px;}
.match-card{border:1px solid var(--gris-borde);border-radius:5px;overflow:hidden;background:var(--gris-card);width:182px;flex-shrink:0;transition:box-shadow .2s,border-color .2s;}
.match-card.defined{border-color:rgba(0,193,101,.35);}
.match-card.final-card{border-color:rgba(255,215,0,.4);}
.match-card.third-card{border-color:rgba(210,140,90,.5);}
.match-card.path{border-color:var(--oro);box-shadow:0 0 8px rgba(255,215,0,.35);}
.match-label{font-size:.56rem;color:var(--texto-dim);padding:2px 6px;background:var(--gris-oscuro);border-bottom:1px solid var(--gris-borde);letter-spacing:.3px;}
.team-slot{display:flex;align-items:center;gap:5px;padding:5px 7px;border-bottom:1px solid #1C1C1C;cursor:grab;user-select:none;min-height:32px;transition:background .15s;position:relative;}
.team-slot:last-child{border-bottom:none;}
.team-slot:hover{background:#2A2A2A;}
.team-slot.drag-over{background:rgba(0,193,101,.15);}
.team-slot.dragging{opacity:.35;}
.team-slot.empty{cursor:default;}
.team-slot.placed{animation:pop .35s ease;}
.team-slot.reject{animation:rejectShake .45s ease;}
@keyframes rejectShake{0%,100%{transform:translateX(0);background:transparent;}20%,60%{transform:translateX(-6px);background:rgba(230,57,70,.3);}40%,80%{transform:translateX(6px);background:rgba(230,57,70,.3);}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--rojo);color:#fff;font-size:.75rem;font-weight:600;padding:8px 16px;border-radius:6px;z-index:500;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@keyframes pop{0%{transform:scale(.85);background:rgba(0,193,101,.35);}60%{transform:scale(1.05);}100%{transform:scale(1);}}
.ts-flag{font-size:1.1rem;line-height:1;flex-shrink:0;}
.ts-name{font-size:.72rem;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ts-name.dim{color:var(--texto-dim);font-style:italic;font-weight:400;}
.ts-score{font-family:'Bebas Neue',sans-serif;font-size:.85rem;color:var(--verde);min-width:14px;text-align:center;}
.ts-remove{font-size:.7rem;color:var(--texto-dim);cursor:pointer;padding:0 2px;display:none;}
.team-slot.occupied:hover .ts-remove{display:block;}
.gm-pos{font-family:'Bebas Neue',sans-serif;font-size:.75rem;width:14px;text-align:center;color:var(--texto-dim);flex-shrink:0;}
.gm-pos.p1{color:var(--verde);}
.gm-pos.p2{color:#5BC8F5;}
.gm-pos.p3{color:var(--oro);}

/* condensed mode */
.bracket-canvas.condensed .match-card{width:128px;}
.bracket-canvas.condensed .ts-name{font-size:.62rem;}
.bracket-canvas.condensed .match-label{font-size:.5rem;}
.bracket-canvas.condensed .phase-col{margin-right:12px !important;width:auto !important;}
.bracket-canvas.condensed .team-slot{min-height:26px;padding:3px 5px;}

/* bottom sheet (selección por toque en celular) */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sheet{background:var(--gris-card);border:1px solid var(--gris-borde);border-bottom:none;border-radius:14px 14px 0 0;width:100%;max-width:480px;max-height:72vh;overflow-y:auto;padding:10px 10px 18px;display:flex;flex-direction:column;gap:6px;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-title{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;color:var(--verde);font-size:1.05rem;padding:8px;text-align:center;border-bottom:1px solid var(--gris-borde);margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:8px;}
.sheet-btn{display:flex;align-items:center;gap:9px;background:var(--gris-medio);border:1px solid var(--gris-borde);color:var(--texto);font-family:'Inter',sans-serif;font-size:.92rem;font-weight:500;padding:12px 14px;border-radius:9px;cursor:pointer;text-align:left;}
.sheet-btn:active{background:#2c2c2c;}
.sheet-btn .ts-flag{font-size:1.25rem;}
.sheet-btn.danger{color:var(--rojo);border-color:rgba(230,57,70,.4);}
.sheet-btn.cancel{justify-content:center;color:var(--texto-dim);margin-top:6px;font-weight:600;}

/* drag ghost (touch) */
.drag-ghost{position:fixed;z-index:999;pointer-events:none;background:var(--gris-card);border:1px solid var(--verde);border-radius:5px;padding:4px 8px;font-size:.72rem;display:flex;align-items:center;gap:5px;opacity:.9;box-shadow:0 4px 14px rgba(0,0,0,.6);transform:translate(-50%,-120%);}

@media(max-width:600px){
  /* el header pasa a dos filas: logo arriba, navegación centrada abajo */
  header{height:auto;flex-wrap:wrap;justify-content:center;gap:4px;padding:6px 10px;}
  .logo{font-size:1.25rem;letter-spacing:2px;}
  nav{width:100%;justify-content:center;flex-wrap:wrap;}
  nav button{padding:5px 8px;font-size:.7rem;}
  .stats-bar{grid-template-columns:repeat(2,1fr);}
  .partido-row{grid-template-columns:56px 1fr auto 1fr 56px;font-size:.72rem;gap:.35rem;}
  /* inputs de marcador más compactos en móvil para que la fila de Ronda de 32 no se desborde */
  .score-input{width:27px;height:30px;font-size:1.15rem;}
  .pr-vs{font-size:1.15rem;gap:3px;}
  /* compacta la tabla de posiciones para que la columna Pts no se corte */
  .pos-table{font-size:.72rem;}
  .pos-table th,.pos-table td{padding:4px 2px;}
  .pos-table th.left,.pos-table td.team-cell{padding-left:6px;}
  .pos-table td.team-cell{padding-right:2px;gap:3px;}
  .pos-table .eq-flag,.pos-table .ts-flag{font-size:1rem;}
  /* tabla de terceros en móvil: ajustes simples */
  .terceros-card .pos-table{font-size:.68rem;}
  .terceros-card .pos-table th,.terceros-card .pos-table td{padding:3px 2px;}
  .terceros-card .pos-table th.left,.terceros-card .pos-table td.team-cell{width:110px;padding:3px 4px;}
  .terceros-card .pos-table th.grupo-col,.terceros-card .pos-table td.grupo-cell{width:26px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">WORLD<span>CUP</span> <span style="color:var(--verde)">2026</span></div>
  <nav>
    <button class="active" onclick="showTab('grupos',this)">Grupos</button>
    <button onclick="showTab('partidos',this)">Partidos</button>
    <button onclick="showTab('bracket',this)">Eliminatorias</button>
  </nav>
</header>

<div class="stats-bar">
  <div class="stat-cell"><div class="stat-num">48</div><div class="stat-lbl">Selecciones</div></div>
  <div class="stat-cell"><div class="stat-num">12</div><div class="stat-lbl">Grupos</div></div>
  <div class="stat-cell"><div class="stat-num" id="stat-jugados">0/104</div><div class="stat-lbl">Jugados</div></div>
  <div class="stat-cell"><div class="stat-num">19 Jul</div><div class="stat-lbl">Final · NY/NJ</div></div>
</div>

<div class="progress-wrap" id="progress-wrap"></div>

<!-- TAB GRUPOS + POSICIONES -->
<div id="tab-grupos" class="tab active">
  <div class="pos-toolbar">
    <h2>Grupos y Posiciones</h2>
    <button class="btn-reset" onclick="resetScores()">↺ Borrar marcadores</button>
    <span class="api-status" id="api-status"></span>
  </div>
  <div class="legend">

function computeStats(letra){
  const grp=GRUPOS.find(g=>g.letra===letra);
  const st={};
  grp.equipos.forEach(n=>st[n]={n,f:flag(n),conf:T(n).conf,rank:T(n).rank,host:T(n).host,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0});
  FIXTURES.filter(f=>f.grupo===letra).forEach(f=>{
    const s=scores[f.id];
    if(!s||s.h==null||s.a==null) return;
    const h=+s.h,a=+s.a;
    const H=st[f.h],A=st[f.a];
    H.pj++;A.pj++;H.gf+=h;H.gc+=a;A.gf+=a;A.gc+=h;
    if(h>a){H.pg++;A.pp++;}else if(h<a){A.pg++;H.pp++;}else{H.pe++;A.pe++;}
  });
  return st;
}
function pts(e){return e.pg*3+e.pe;}
function dg(e){return e.gf-e.gc;}
function sortGroup(letra){
  const rows=Object.values(computeStats(letra));
  rows.sort((a,b)=>pts(b)-pts(a)||dg(b)-dg(a)||b.gf-a.gf||a.rank-b.rank);
  return rows;
}
// los 8 mejores terceros de los 12 grupos
function bestThirds(){
  const t=GRUPOS.map(g=>({...sortGroup(g.letra)[2],grupo:g.letra}));
  t.sort((a,b)=>pts(b)-pts(a)||dg(b)-dg(a)||b.gf-a.gf||a.rank-b.rank);
  return {qualified:new Set(t.slice(0,8).map(x=>x.n)),ordered:t};
}

// Obtener equipo para Ronda de 32 basado en descripción (ej: "1° Grupo A")
function getTeamForR32Desc(desc){
  if(!desc) return null;
  let m;
  // Formato: "1° Grupo A" o "2° Grupo B"
  if((m=desc.match(/^([12])° Grupo ([A-L])$/))){
    const pos=parseInt(m[1]);
    const letra=m[2];
    try{
      const sorted=sortGroup(letra);
      return sorted[pos-1]||null;
    }catch(e){return null;}
  }
  // Formato: "3° A/B/C/D/F" — devolver el mejor tercero del grupo permitido
  if(desc.startsWith('3°')){
    const allowed=desc.replace('3° ','').split('/');
    const thirdData=bestThirds().ordered;
    for(const t of thirdData){
      if(allowed.includes(t.grupo)) return t;
    }
  }
  return null;
}

// Descripción legible del rival pendiente (ej: "W J76" → "Ganador de J76")
function descLegible(desc){
  if(!desc) return desc;
  let m;
  if((m=desc.match(/^W (J\d+)$/))) return 'Ganador de '+m[1];
  if((m=desc.match(/^Perdedor SF(\d+)$/))) return 'Perdedor de Semifinal '+m[1];
  return desc;
}

function matchTeamName(displayName){
  const d=(displayName||'').toLowerCase();
  for(const [name,t] of Object.entries(TEAMS)){
    if(t.espn.some(a=>d.includes(a))) return name;
  }
  return null;
}
function setApiStatus(msg,cls){
  ['api-status','api-status2'].forEach(id=>{
    const el=document.getElementById(id);
    el.textContent=msg;el.className='api-status '+(cls||'');
  });
}
async function actualizarESPN(){
  setApiStatus('Consultando ESPN…');
  try{
    const url='https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=20260611-20260719&limit=300';
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    const events=data.events||[];
    let updated=0;
    events.forEach(ev=>{
      const comp=(ev.competitions||[])[0];
      if(!comp) return;
      const home=(comp.competitors||[]).find(c=>c.homeAway==='home');
      const away=(comp.competitors||[]).find(c=>c.homeAway==='away');
      if(!home||!away) return;
      const hN=matchTeamName(home.team&&home.team.displayName);
      const aN=matchTeamName(away.team&&away.team.displayName);
      const state=ev.status&&ev.status.type?ev.status.type.state:'pre'; // pre|in|post
      if(state==='pre') return;
      const hS=parseInt(home.score),aS=parseInt(away.score);
      if(isNaN(hS)||isNaN(aS)) return;
      // ¿es partido de fase de grupos?
      const fx=hN&&aN?FIXTURES.find(f=>(f.h===hN&&f.a===aN)||(f.h===aN&&f.a===hN)):null;
      if(fx){
        const inv=fx.h!==hN;
        scores[fx.id]={h:inv?aS:hS,a:inv?hS:aS,live:state==='in'};
        updated++;
        return;
      }
      // eliminatorias: casar por fecha (UTC y día anterior) + ciudad
      if(!hN||!aN) return;
      const evDate=(ev.date||'').slice(0,10);
      const prev=evDate?new Date(Date.parse(evDate)-86400000).toISOString().slice(0,10):'';
      const venue=((comp.venue&&comp.venue.address&&(comp.venue.address.city||''))+'').toLowerCase();
      const koSlots=ALL_SLOTS.filter(s=>!FIXTURES.some(f=>f.id===s.id));
      let cands=koSlots.filter(s=>SLOT_DATE[s.id]===evDate||SLOT_DATE[s.id]===prev);
      // prioridad: slot que ya contiene a alguno de los dos equipos
      const withTeam=cands.filter(s=>{
        const st=bracketState[s.id];
        return (st.t1&&(st.t1.n===hN||st.t1.n===aN))||(st.t2&&(st.t2.n===hN||st.t2.n===aN));
      });
      if(withTeam.length) cands=withTeam;
      else if(venue&&cands.length>1){
        const byCity=cands.filter(s=>{
          const sede=s.label.split(' · ')[2]||'';
          const pat=SEDE_CITY[sede];
          return pat&&new RegExp(pat).test(venue);
        });
        if(byCity.length) cands=byCity;
      }
      if(cands.length!==1) return; // ambiguo: no tocar
      const slot=cands[0];
      bracketState[slot.id].t1={n:hN,f:flag(hN)};
      bracketState[slot.id].t2={n:aN,f:flag(aN)};
      koScores[slot.id]={s1:hS,s2:aS,final:state==='post'};
      updated++;
      if(state==='post'&&NEXT[slot.id]){
        // avanzar ganador (en empate ESPN reporta penales en shootoutScore)
        let winner=hS>aS?hN:aS>hS?aN:null;
        if(winner===null){
          const p1=parseInt(home.shootoutScore),p2=parseInt(away.shootoutScore);
          if(!isNaN(p1)&&!isNaN(p2)) winner=p1>p2?hN:aN;
        }
        if(winner){
          const nx=NEXT[slot.id];
          bracketState[nx.slot][nx.pos]={n:winner,f:flag(winner)};
        }
      }
    });
    saveScores();saveBracket();
    renderAll();
    setApiStatus(updated?`✓ ${updated} partido(s) actualizados`:'Sin resultados todavía (el torneo aún no genera datos)', updated?'ok':'');
  }catch(e){
    setApiStatus('✗ No se pudo conectar a ESPN ('+e.message+')','err');
  }
}

// SIMULADOR — por ranking FIFA
// ══════════════════════════════════════════════
function simularBracket(){
  // La proyección se construye en un estado AISLADO (simBracket); no toca lo oficial,
  // así nunca afecta a Grupos ni Partidos.
  const sim={};
  ALL_SLOTS.forEach(sl=>{sim[sl.id]={t1:null,t2:null};});
  // 1°,2°,3° de cada grupo según tabla actual (sin partidos = decide el ranking)
  const firsts={},seconds={};
  let thirds=[];
  GRUPOS.forEach(g=>{
    const s=sortGroup(g.letra);
    firsts[g.letra]=s[0];seconds[g.letra]=s[1];
    thirds.push({...s[2],grupo:g.letra});
  });
  thirds.sort((a,b)=>pts(b)-pts(a)||dg(b)-dg(a)||b.gf-a.gf||a.rank-b.rank);
  const qualThirds=thirds.slice(0,8);
  // asignar terceros a sus llaves permitidas (backtracking)
  const thirdSlots=R32.filter(s=>s.t2desc.startsWith('3°')).map(s=>({
    id:s.id,allowed:s.t2desc.replace('3° ','').split('/')
  }));
  function assign(slots,pool){
    if(!slots.length) return {};
    const [s,...rest]=slots;
    for(const t of pool){
      if(s.allowed.includes(t.grupo)){
        const r=assign(rest,pool.filter(x=>x!==t));
        if(r) return Object.assign({[s.id]:t},r);
      }
    }
    return null;
  }
  const thirdMap=assign(thirdSlots,qualThirds)||{};
  // llenar R32
  R32.forEach(sl=>{
    ['t1','t2'].forEach(pos=>{
      const d=sl[pos+'desc'];
      let team=null,m;
      if((m=d.match(/^1° Grupo ([A-L])$/))) team=firsts[m[1]];
      else if((m=d.match(/^2° Grupo ([A-L])$/))) team=seconds[m[1]];
      else if(d.startsWith('3°')) team=thirdMap[sl.id];
      sim[sl.id][pos]=team?{n:team.n,f:team.f}:null;
    });
  });
  // avanzar por ranking (mejor rank gana)
  [...R32,...OCT,...QF,...SF].forEach(sl=>{
    const st=sim[sl.id];
    if(!st.t1||!st.t2||!NEXT[sl.id]) return;
    const w=T(st.t1.n).rank<=T(st.t2.n).rank?st.t1:st.t2;
    const nx=NEXT[sl.id];
    sim[nx.slot][nx.pos]={...w};
  });
  simBracket=sim;            // activa el modo simulación (sin persistir, sin tocar lo oficial)
  renderBracket();
  const f=sim['final'];
  if(f.t1&&f.t2){
    const champ=T(f.t1.n).rank<=T(f.t2.n).rank?f.t1:f.t2;
    setTimeout(()=>alert('🏆 Campeón proyectado por ranking FIFA: '+champ.f+' '+champ.n),100);
  }
  showTab('bracket',document.querySelectorAll('nav button')[2]);
}

function resetBracket(){
  if(inSim()){exitSim();return;}   // si hay simulación activa, solo salimos de ella (no toca lo oficial)

  ALL_SLOTS.forEach(sl=>{bracketState[sl.id]={t1:null,t2:null};});
  koScores={};

}

function pathSlots(fromSlotId){
  const ids=[fromSlotId];
  let cur=fromSlotId;
  while(NEXT[cur]){cur=NEXT[cur].slot;ids.push(cur);}
  return ids;
}
function groupOf(name){
  const g=GRUPOS.find(g=>g.equipos.includes(name));
  return g?g.letra:null;
}
// ruta de un equipo: si ya está en el bracket usa esa llave; si no, la que le toca por su posición actual en el grupo
function routeStartFor(name){
  const inBracket=ALL_SLOTS.find(s=>{
    const st=cb()[s.id];
    return (st.t1&&st.t1.n===name)||(st.t2&&st.t2.n===name);
  });
  if(inBracket) return inBracket.id;
  const letra=groupOf(name);
  if(!letra) return null;
  const pos=sortGroup(letra).findIndex(e=>e.n===name)+1;
  if(pos>2) return null; // 3°/4°: su llave depende del sorteo de mejores terceros
  const slot=R32.find(s=>s.t1desc===`${pos}° Grupo ${letra}`||s.t2desc===`${pos}° Grupo ${letra}`);
  return slot?slot.id:null;
}
function toggleRoute(name,startSlotId){
  if(pathTeam&&pathTeam.name===name){pathTeam=null;}
  else if(startSlotId){pathTeam={slot:startSlotId,name,grupo:groupOf(name)};}
  else{pathTeam=null;}
  renderBracket();
}

function isTouchMode(){
  return window.matchMedia('(pointer:coarse)').matches || window.innerWidth<=700;
}
// equipos válidos para una casilla concreta (mismos que aceptaría el arrastre)
// En R32 solo muestra equipos que realmente pueden jugar juntos según las llaves oficiales
function slotCandidates(slotId,pos){
  if(slotId.startsWith('r32')){
    const sl=R32.find(s=>s.id===slotId), d=sl[pos+'desc']; let m;
    const otherPos=pos==='t1'?'t2':'t1';
    const otherTeam=cb()[slotId][otherPos];
    let candidates=[];

    if((m=d.match(/Grupo ([A-L])$/))) {
      candidates=GRUPOS.find(g=>g.letra===m[1]).equipos.slice();
    } else if(d.startsWith('3°')) {
      const groups=d.replace('3° ','').split('/');
      candidates=groups.flatMap(L=>GRUPOS.find(g=>g.letra===L).equipos);
    }

    // Si hay un equipo en la otra posición, filtrar candidatos que sean compatibles
    if(otherTeam){
      candidates=candidates.filter(teamName=>{
        return isValidR32Matchup(
          pos==='t1'?teamName:otherTeam.n,
          't1',
          pos==='t1'?otherTeam.n:teamName,
          't2',
          sl
        );
      });
    }

    return candidates;
  }
  const sl=ALL_SLOTS.find(s=>s.id===slotId), d=sl[pos+'desc']; let m,feed=null;
  if((m=d.match(/^W (J\d+)/))) feed=J2SLOT[m[1]];
  else if(/SF1/.test(d)) feed='sf-1';
  else if(/SF2/.test(d)) feed='sf-2';
  if(!feed) return [];
  const st=cb()[feed];
  return [st.t1,st.t2].filter(Boolean).map(t=>t.n);
}

      },{passive:true});

  if(touch) return div; // en celular no hay arrastre: salimos aquí
  div.addEventListener('dragover',e=>{e.preventDefault();div.classList.add('drag-over');});

  div.addEventListener('touchend',e=>{
    if(!dragData) return;
    const touch=e.changedTouches[0];

    const target=el&&el.closest('.team-slot');
    if(target) handleDrop(target.dataset.slotId,target.dataset.pos);

  return div;
}

const PHASE_OF=id=>id.startsWith('r32')?'r32':id.startsWith('oct')?'oct':id.startsWith('qf')?'qf':id.startsWith('sf')?'sf':'final';
let toastTimer=null;

// Valida si dos equipos pueden jugar juntos en la Ronda de 32 (llaves oficiales FIFA)
function isValidR32Matchup(team1,team1Pos,team2,team2Pos,slot){
  if(!team1||!team2) return true; // si falta un equipo, dejar para después
  const g1=groupOf(team1), g2=groupOf(team2);
  const d1=slot[team1Pos+'desc'], d2=slot[team2Pos+'desc'];

  // Extraer posición y grupo esperado de cada descripción
  const m1=d1.match(/^([123])°\s*(Grupo\s+)?([A-L])?(.*)$/), m2=d2.match(/^([123])°\s*(Grupo\s+)?([A-L])?(.*)$/);

  // Validar posición en tabla (1°, 2°, 3°)
  const pos1=m1?m1[1]:'', pos2=m2?m2[1]:'';
  const grp1=m1&&m1[3]?m1[3]:'', grp2=m2&&m2[3]?m2[3]:'';
  const allowed1=m1&&m1[4]?m1[4].split('/').map(s=>s.trim()).filter(s=>s):'';
  const allowed2=m2&&m2[4]?m2[4].split('/').map(s=>s.trim()).filter(s=>s):'';

  // Regla: dos 1° del mismo grupo NO pueden jugar juntos
  if(pos1==='1'&&pos2==='1'&&g1===g2) return false;
  // Regla: dos 2° del mismo grupo NO pueden jugar juntos
  if(pos1==='2'&&pos2==='2'&&g1===g2) return false;
  // Regla: un 1° y un 2° del MISMO grupo NO pueden jugar juntos (siempre son de grupos diferentes)
  if((pos1==='1'&&pos2==='2'||pos1==='2'&&pos2==='1')&&g1===g2) return false;

  return true;
}

// en R32 cada casilla solo acepta equipos del grupo que indica su descripción
function slotRuleError(name,slotId,pos){
  if(PHASE_OF(slotId)!=='r32') return null;
  const sl=R32.find(s=>s.id===slotId);
  const d=sl[pos+'desc'];
  const g=groupOf(name);
  const otherPos=pos==='t1'?'t2':'t1';
  const otherTeam=cb()[slotId][otherPos];
  let m;

  // Validar que el equipo cumpla su descripción individual
  if((m=d.match(/^([12])° Grupo ([A-L])$/))){
    if(g!==m[2]) return `⚠ Esa casilla es para el ${m[1]}° del Grupo ${m[2]} (${name} es del Grupo ${g})`;
  }else if(d.startsWith('3°')){
    const allowed=d.replace('3° ','').split('/');
    if(!allowed.includes(g)) return `⚠ Esa casilla acepta terceros de los grupos ${allowed.join(', ')} (${name} es del Grupo ${g})`;
  }

  // Validar compatibilidad con el otro equipo del matchup
  if(otherTeam&&!isValidR32Matchup(pos==='t1'?name:otherTeam.n, pos, pos==='t1'?otherTeam.n:name, otherPos, sl)){
    const other=otherTeam.n;
    const otherDesc=sl[otherPos+'desc'];
    return `⚠ ${name} (${d}) no puede jugar contra ${other} (${otherDesc}) en esta llave`;
  }

  return null;
}
// un equipo no puede aparecer dos veces en la misma ronda
function dupInPhase(name,phase,exclusions){
  return ALL_SLOTS.some(s=>PHASE_OF(s.id)===phase&&['t1','t2'].some(p=>{
    if(exclusions.some(x=>x.slot===s.id&&x.pos===p)) return false;
    const t=cb()[s.id][p];
    return t&&t.n===name;
  }));
}

function handleDrop(toSlotId,toPos){
  if(!dragData) return;
  const{team,fromSlotId,fromPos}=dragData;
  dragData=null;
  if(toSlotId==='__source__'||toSlotId.startsWith('grp-')) return;
  // regla de llave (solo R32)
  let err=slotRuleError(team.n,toSlotId,toPos);
  // duplicado en la ronda (sin contar la casilla destino ni la de origen si es de la misma ronda)
  if(!err){
    const phase=PHASE_OF(toSlotId);
    const excl=[{slot:toSlotId,pos:toPos}];
    if(fromSlotId&&PHASE_OF(fromSlotId)===phase) excl.push({slot:fromSlotId,pos:fromPos});
    if(dupInPhase(team.n,phase,excl)) err=`⚠ ${team.n} ya está en esta ronda`;
  }
  // si hay intercambio, el desplazado también debe ser válido en la casilla de origen
  const displaced=cb()[toSlotId][toPos];
  if(!err&&displaced&&fromSlotId){
    err=slotRuleError(displaced.n,fromSlotId,fromPos);
    if(err) err+=' — no se puede intercambiar';
  }
  if(err){rejectSlot(toSlotId,toPos,err);return;}
  cb()[toSlotId][toPos]=team;
  if(fromSlotId&&cb()[fromSlotId]!==undefined){
    cb()[fromSlotId][fromPos]=displaced||null;
  }
  lastPlaced={slot:toSlotId,pos:toPos};
  afterBracketEdit();
  setTimeout(()=>{lastPlaced=null;},400);
}

function makeMatchCard(slot,extraClass){
  const{id,label,t1desc,t2desc}=slot;
  const{t1,t2}=cb()[id];
  const card=document.createElement('div');
  card.className='match-card '+(extraClass||'')+((t1||t2)?' defined':'');
  card.dataset.slotId=id;
  card.title=`${label}\n${t1desc} vs ${t2desc}`;
  if(pathTeam&&pathSlots(pathTeam.slot).includes(id)) card.classList.add('path');
  const lbl=document.createElement('div');
  lbl.className='match-label'; lbl.textContent=label;
  card.appendChild(lbl);
  card.appendChild(makeTeamSlot(id,'t1',t1));
  card.appendChild(makeTeamSlot(id,'t2',t2));
  return card;
}


// columna de fase de grupos: mini-tarjetas con la tabla actual (subconjunto de letras)
function makeGroupsCol(letras){
  const col=document.createElement('div');
  col.className='phase-col';
  col.style.cssText='width:175px;flex-shrink:0;margin-right:32px;';
  const lbl=document.createElement('div');
  lbl.className='phase-label'; lbl.textContent='GRUPOS '+letras[0]+'–'+letras[letras.length-1];
  col.appendChild(lbl);
  const matches=document.createElement('div');
  matches.className='phase-matches';
  GRUPOS.filter(g=>letras.includes(g.letra)).forEach(g=>{
    const card=document.createElement('div');
    card.className='match-card'+(pathTeam&&pathTeam.grupo===g.letra?' path':'');
    card.dataset.slotId='grp-'+g.letra;
    card.title=`Grupo ${g.letra} · ${g.inicio} — ${g.fin} · Pasa el mouse para ver sus llaves, clic en un equipo para su ruta`;
    card.addEventListener('mouseenter',()=>{hoverGroup=g.letra;drawLines();});
    card.addEventListener('mouseleave',()=>{hoverGroup=null;drawLines();});
    const lb=document.createElement('div');
    lb.className='match-label'; lb.textContent='GRUPO '+g.letra;
    card.appendChild(lb);
    sortGroup(g.letra).forEach((eq,i)=>{
      const row=document.createElement('div');
      row.className='team-slot occupied';
      row.dataset.grow=String(i+1);
      row.draggable=!isTouchMode();
      if(pathTeam&&pathTeam.name===eq.n) row.style.background='rgba(255,215,0,.15)';
      row.innerHTML=`<span class="gm-pos ${i===0?'p1':i===1?'p2':i===2?'p3':''}">${i+1}</span><span class="ts-flag">${eq.f}</span><span class="ts-name">${eq.n}</span>`;
      row.addEventListener('click',()=>{
        const start=routeStartFor(eq.n);
        if(start) toggleRoute(eq.n,start);
        else if(pathTeam&&pathTeam.name===eq.n) toggleRoute(eq.n,null);
      });
      if(!isTouchMode()){
        row.addEventListener('dragstart',e=>{
          dragData={team:{n:eq.n,f:eq.f},fromSlotId:null,fromPos:null};
          e.dataTransfer.effectAllowed='copy';
        });
        row.addEventListener('touchstart',()=>{
          dragData={team:{n:eq.n,f:eq.f},fromSlotId:null,fromPos:null};
        },{passive:true});
      }
      card.appendChild(row);
    });
    matches.appendChild(card);
  });
  col.appendChild(matches);
  return col;
}

function makePhaseCol(name,slots,w){
  const col=document.createElement('div');
  col.className='phase-col';
  col.style.cssText=`width:${w||185}px;flex-shrink:0;margin-right:24px;`;
  const lbl=document.createElement('div');
  lbl.className='phase-label'; lbl.textContent=name;
  col.appendChild(lbl);
  const matches=document.createElement('div');
  matches.className='phase-matches';
  slots.forEach(s=>{
    const extra=name==='🏆 FINAL'?'final-card':'';
    matches.appendChild(makeMatchCard(s,extra));
  });
  col.appendChild(matches);
  return col;
}

let condensed=false;
function toggleCondensed(btn){
  condensed=!condensed;
  document.getElementById('bracket-canvas').classList.toggle('condensed',condensed);
  btn.textContent=condensed?'▣ Modo completo':'▣ Modo compacto';
  requestAnimationFrame(drawLines);
}

// líneas conectoras: cada llave se une con la posición que alimenta en la siguiente ronda
function drawLines(){
  const canvas=document.getElementById('bracket-canvas');
  const old=document.getElementById('bracket-lines');
  if(old) old.remove();
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id='bracket-lines';
  svg.setAttribute('width',canvas.scrollWidth);
  svg.setAttribute('height',canvas.scrollHeight);
  const cRect=canvas.getBoundingClientRect();
  const chain=pathTeam?pathSlots(pathTeam.slot):[];
  function connect(srcEl,tgtEl,color,w,dashed,dx){
    const a=srcEl.getBoundingClientRect(),b=tgtEl.getBoundingClientRect();
    // dirección automática: en la mitad derecha las líneas avanzan hacia la izquierda
    const rightward=a.left<=b.left;
    const x1=(rightward?a.right:a.left)-cRect.left, y1=a.top+a.height/2-cRect.top;
    const x2=(rightward?b.left:b.right)-cRect.left, y2=b.top+b.height/2-cRect.top;
    const mx=dx!=null?(rightward?x1+dx:x1-dx):x1+(x2-x1)/2;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M ${x1} ${y1} H ${mx} V ${y2} H ${x2}`);
    p.setAttribute('stroke',color);
    p.setAttribute('stroke-width',w);
    p.setAttribute('fill','none');
    if(dashed) p.setAttribute('stroke-dasharray','4 3');
    svg.appendChild(p);
  }
  // grupos → ronda de 32: líneas bajo demanda (solo ruta iluminada o grupo con hover)
  R32.forEach(sl=>{
    ['t1','t2'].forEach(pos=>{
      const m=sl[pos+'desc'].match(/^([12])° Grupo ([A-L])$/);
      if(!m) return;
      const placed=cb()[sl.id][pos];
      const rowTeam=sortGroup(m[2])[+m[1]-1];
      const enRuta=pathTeam&&chain[0]===sl.id&&pathTeam.grupo===m[2]&&
        ((placed&&placed.n===pathTeam.name)||(!placed&&rowTeam&&rowTeam.n===pathTeam.name));
      if(!enRuta&&hoverGroup!==m[2]) return;
      const srcEl=canvas.querySelector(`.match-card[data-slot-id="grp-${m[2]}"] [data-grow="${m[1]}"]`);
      const tgtEl=canvas.querySelector(`.match-card[data-slot-id="${sl.id}"] .team-slot[data-pos="${pos}"]`);
      if(!srcEl||!tgtEl) return;
      const filled=!!placed;
      const dx=6+(m[1]==='2'?5:0);
      if(enRuta) connect(srcEl,tgtEl,'#FFD700',2.5,false,dx);
      else connect(srcEl,tgtEl,filled?'rgba(0,193,101,.75)':'rgba(120,120,120,.8)',1.5,!filled,dx);
    });
  });
  // eliminatorias: ganador → siguiente ronda
  Object.entries(NEXT).forEach(([srcId,nx])=>{
    const srcEl=canvas.querySelector(`.match-card[data-slot-id="${srcId}"]`);
    const tgtEl=canvas.querySelector(`.match-card[data-slot-id="${nx.slot}"] .team-slot[data-pos="${nx.pos}"]`);
    if(!srcEl||!tgtEl) return;
    let color='#2E2E2E',w=2;
    if(chain.includes(srcId)&&chain.includes(nx.slot)){color='#FFD700';w=2.5;}
    else if(cb()[nx.slot][nx.pos]){color='rgba(0,193,101,.75)';}
    connect(srcEl,tgtEl,color,w);
  });
  canvas.insertBefore(svg,canvas.firstChild);
}
window.addEventListener('resize',()=>{
  if(document.getElementById('tab-bracket').classList.contains('active')) drawLines();
});

// centra la vista del cuadro: deja la Final (columna central) en medio de la pantalla
function centerBracketScroll(){
  const scroll=document.getElementById('bracket-scroll');
  const canvas=document.getElementById('bracket-canvas');
  if(!scroll||!canvas) return;
  scroll.scrollLeft=Math.max(0,(canvas.scrollWidth-scroll.clientWidth)/2);
}

// columna central: final + tercer lugar
function makeCenterCol(){
  const col=document.createElement('div');
  col.className='phase-col';
  col.style.cssText='width:200px;flex-shrink:0;margin-right:24px;';
  const lbl=document.createElement('div');
  lbl.className='phase-label'; lbl.textContent='🏆 FINAL · 🥉 3ER LUGAR';
  col.appendChild(lbl);
  const matches=document.createElement('div');
  matches.className='phase-matches';
  matches.appendChild(makeMatchCard(FINAL[0],'final-card'));
  matches.appendChild(makeMatchCard(THIRD[0],'third-card'));
  col.appendChild(matches);
  return col;
}

// aviso de modo simulación (proyección que no afecta a Grupos ni Partidos)
function renderSimBanner(){
  const el=document.getElementById('sim-banner');
  if(!el) return;
  const btn=document.getElementById('btn-reset-bracket');
  if(inSim()){
    el.style.display='';
    el.innerHTML=`⚡ Estás viendo una <b>simulación</b> (proyección por ranking FIFA). No afecta a <b>Grupos</b> ni <b>Partidos</b>. <button class="btn-reset" onclick="exitSim()" style="margin-left:auto;">↩ Volver al bracket oficial</button>`;
    if(btn) btn.textContent='↺ Salir de simulación';
  }else{
    el.style.display='none'; el.innerHTML='';
    if(btn) btn.textContent='↺ Limpiar bracket';
  }
}

// doble pirámide: las dos mitades del cuadro avanzan hacia la final al centro
function renderBracket(){
  renderSimBanner();
  const instr=document.getElementById('bracket-instr');
  if(instr) instr.innerHTML=isTouchMode()
    ? '👆 Toca una llave para elegir equipo (solo muestra los válidos). Toca un equipo para ver su ruta o quitarlo. O usa <b>&nbsp;⚡ Simular</b>&nbsp; para llenarlo automático.'
    : '☝️ Arrastra una selección a su llave. La Ronda de 32 valida grupo y posición; de octavos en adelante decides tú. Clic en un equipo para iluminar su ruta. ✕ para quitar.';
  const canvas=document.getElementById('bracket-canvas');
  canvas.innerHTML='';
  const cols=[
    makeGroupsCol('ABCDEF'),
    makePhaseCol('RONDA DE 32',R32_ORD.slice(0,8),190),
    makePhaseCol('OCTAVOS',OCT_ORD.slice(0,4),185),
    makePhaseCol('CUARTOS',QF_ORD.slice(0,2),185),
    makePhaseCol('SEMIFINAL 1',[SF_ORD[0]],188),
    makeCenterCol(),
    makePhaseCol('SEMIFINAL 2',[SF_ORD[1]],188),
    makePhaseCol('CUARTOS',QF_ORD.slice(2),185),
    makePhaseCol('OCTAVOS',OCT_ORD.slice(4),185),
    makePhaseCol('RONDA DE 32',R32_ORD.slice(8),190),
    makeGroupsCol('GHIJKL'),
  ];
  cols.forEach(c=>canvas.appendChild(c));
  canvas.classList.toggle('condensed',condensed);
  requestAnimationFrame(drawLines);
}

function showTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='bracket') requestAnimationFrame(()=>{drawLines();centerBracketScroll();});
  try{localStorage.setItem('wc2026_tab',id);}catch(e){}
}
function restoreTab(){
  let id=null;
  try{id=localStorage.getItem('wc2026_tab');}catch(e){}
  if(!id||!document.getElementById('tab-'+id)) return;
  const btn=[...document.querySelectorAll('nav button')].find(b=>b.getAttribute('onclick').includes(`'${id}'`));
  if(btn) showTab(id,btn);
}

  });
}else{

  navBtns[1].addEventListener('click',()=>setTimeout(actualizarESPN,100)); // Partidos

// scroll drag bracket
const bs=document.getElementById('bracket-scroll');
let isDown=false,startX,scrollLeft;
bs.addEventListener('mousedown',e=>{
  if(e.target.closest('.team-slot')) return;
  isDown=true; startX=e.pageX-bs.offsetLeft; scrollLeft=bs.scrollLeft;
});
bs.addEventListener('mouseleave',()=>isDown=false);
bs.addEventListener('mouseup',()=>isDown=false);
bs.addEventListener('mousemove',e=>{
  if(!isDown) return; e.preventDefault();
  bs.scrollLeft=scrollLeft-(e.pageX-bs.offsetLeft-startX);
});
